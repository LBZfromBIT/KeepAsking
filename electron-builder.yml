appId: com.luisliu.keepasking
productName: KeepAsking
copyright: Copyright © 2026 Luis Liu
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - resources/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 追问
  uninstallDisplayName: 追问 KeepAsking

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  # No signing identity in CI by default: builds are unsigned (Gatekeeper will warn)
  identity: null
dmg:
  title: 追问 ${version}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Utility
  executableName: keepasking
  syncDesktopName: true
  maintainer: Luis Liu <noreply@users.noreply.github.com>
  synopsis: 追问 · 划词展开分支的 AI 对话客户端
  description: 支持划词展开分支与实时对话树的 AI 桌面客户端（自带 API Key）。
  desktop:
    entry:
      Name: 追问 KeepAsking
      Comment: 划词展开分支的 AI 对话客户端
deb:
  packageName: keepasking
